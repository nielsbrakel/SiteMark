# The extension is the root package; the website (D-244) is a private workspace package.
packages:
  - website
auditConfig:
  ignoreCves:
    - CVE-2026-85393
    - CVE-2026-93687

# Refuse to install on a Node or pnpm version outside package.json `engines`.
engineStrict: true

# Reviewed and deliberately not run: lefthook's postinstall would install git hooks from inside a
# dependency. `pnpm prepare` (scripts/install-hooks.mjs) installs them instead.
ignoredBuiltDependencies:
  - lefthook
# Dependencies allowed to run install scripts. None need one today; add entries only after review.
onlyBuiltDependencies: []

# Security overrides for transitive development dependencies. Remove each once its parent ships the fix.
overrides:
  # typed-rest-client (via @stryker-mutator/core) pins qs 6.15.1: GHSA-q8mj-m7cp-5q26, GHSA-4mjr-xmp4-gh2g,
  # GHSA-x5fp-wj9c-mxmx are fixed in 6.16.0.
  # magicast (via @vitest/coverage-v8) pulls source-map-js 1.x: GHSA-68fv-2mgg-jv7q is fixed in 1.2.2.
  source-map-js: ^1.2.2
  typed-rest-client>qs: ^6.16.0

# pnpm supply-chain policy (REQ-SEC-009, D-238).

# Fail the install when a dependency wants to run an install script that isn't reviewed below.
strictDepBuilds: true
