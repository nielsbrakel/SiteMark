name: Feature request
description: Suggest an idea or improvement for SiteMark.
labels: ['type:feature']
body:
  - type: markdown
    attributes:
      value: |
        Please check the [spec](https://github.com/nielsbrakel/SiteMark/blob/main/docs/spec.md) first.
        Some things are deliberately out of scope: cloud sync, accounts, analytics, network access and
        broad host permissions.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like SiteMark to handle it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now, or other approaches you thought about.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This idea needs no new permissions, network access or data leaving the browser.
