name: Release

# Runs for protected v* tags only (docs/repo-setup.md §7, D-227). The zip job builds with read access
# only; the attest job holds the OIDC token but runs no project code; the submit job waits in the
# `store` environment for the owner's approval and runs only the pinned store uploader.
on:
  push:
    tags: ['v*']

# Every job declares its own minimal permissions (REQ-SEC-009, D-238).
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  zip:
    name: zip (build, check, checksums)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache in a release (cache poisoning): a clean, frozen install.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Build the store zips (Chrome, Firefox with its sources zip, Edge)
        run: |
          pnpm wxt zip -b chrome
          pnpm wxt zip -b firefox
          pnpm wxt zip -b edge
      - name: Build assertions (manifest, output scan, size budget)
        run: pnpm exec vitest run --project build
        env:
          SITEMARK_TARGETS: chrome,firefox,edge
      - name: Check the manifest in every zip (REQ-SEC-008)
        run: node scripts/check-release-zips.ts .output/*.zip
      - name: Checksums
        working-directory: .output
        run: sha256sum -- *.zip > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            .output/*.zip
            .output/SHA256SUMS
          # upload-artifact skips dot-directories like .output unless told otherwise.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  # Provenance for the zips the zip job built: no checkout, no install, no build, so no dependency
  # ever runs next to the OIDC token.
  attest:
    name: attest (build provenance)
    needs: [zip]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write # the OIDC token that signs the provenance
      attestations: write # stores the attestation in the repository
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.zip

  submit:
    name: submit (Chrome Web Store, Edge Add-ons, Firefox AMO)
    needs: [zip, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: store
    permissions:
      contents: read
      attestations: read # gh attestation verify
    steps:
      # Only for .nvmrc: nothing from the workspace is installed next to the store secrets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - name: Verify the checksums and the build provenance of every zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd release && sha256sum --check SHA256SUMS)
          for zip in release/*.zip; do
            gh attestation verify "$zip" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
      # publish-browser-extension is what `wxt submit` runs; the version is the one pnpm-lock.yaml
      # resolves (tests/unit/release-workflow.test.ts keeps them in step). No install scripts run.
      - name: Submit the checked zips for review
        env:
          npm_config_ignore_scripts: 'true'
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          npx --yes publish-browser-extension@6.1.1 \
            --chrome-zip release/*-chrome.zip \
            --firefox-zip release/*-firefox.zip \
            --firefox-sources-zip release/*-sources.zip \
            --edge-zip release/*-edge.zip
