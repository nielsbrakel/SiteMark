name: Release

# Runs for protected v* tags only (docs/repo-setup.md §7, D-227). The zip job holds no secrets; the
# submit job waits in the `store` environment for the owner's approval.
on:
  push:
    tags: ['v*']

# Every job declares its own minimal permissions (REQ-SEC-009, D-238).
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  zip:
    name: zip (build, check, checksums, provenance)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache in a release (cache poisoning): a clean, frozen install.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Build the store zips (Chrome, Firefox with its sources zip, Edge)
        run: |
          pnpm wxt zip -b chrome
          pnpm wxt zip -b firefox
          pnpm wxt zip -b edge
      - name: Build assertions (manifest, output scan, size budget)
        run: pnpm exec vitest run --project build
        env:
          SITEMARK_TARGETS: chrome,firefox
      - name: Check the manifest in every zip (REQ-SEC-008)
        run: node scripts/check-release-zips.ts .output/*.zip
      - name: Checksums
        working-directory: .output
        run: sha256sum -- *.zip > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .output/*.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            .output/*.zip
            .output/SHA256SUMS
          # upload-artifact skips dot-directories like .output unless told otherwise.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  submit:
    name: submit (Chrome Web Store, Edge Add-ons, Firefox AMO)
    needs: [zip]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: store
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - name: Submit the checked zips for review
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          (cd release && sha256sum --check SHA256SUMS)
          pnpm wxt submit \
            --chrome-zip release/*-chrome.zip \
            --firefox-zip release/*-firefox.zip \
            --firefox-sources-zip release/*-sources.zip \
            --edge-zip release/*-edge.zip
