name: Release

# Runs for protected v* tags only (docs/repo-setup.md §7, D-227). The zip job builds with read access
# only; the attest job holds the OIDC token but runs no project code; the submit job waits in the
# `store` environment for the owner's approval and runs only the locked store uploader.
on:
  push:
    tags: ['v*']

# Every job declares its own minimal permissions (REQ-SEC-009, D-238).
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag that does not match package.json, or a commit whose CI did not pass, never gets built.
  guard:
    name: guard (tag matches version, CI green)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read # the ci-ok check run of the tagged commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag is v<package.json version> and CI passed on that commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$version" ] || { echo "::error::tag $GITHUB_REF_NAME is not $version"; exit 1; }
          passed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=ci-ok" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')
          [ "$passed" -gt 0 ] || { echo "::error::ci-ok has not passed on $GITHUB_SHA"; exit 1; }

  zip:
    name: zip (build, check, checksums)
    needs: [guard]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache in a release (cache poisoning): a clean, frozen install.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Build the store zips (Chrome, Firefox with its sources zip, Edge, Safari)
        run: |
          pnpm wxt zip -b chrome
          pnpm wxt zip -b firefox
          pnpm wxt zip -b edge
          pnpm wxt zip -b safari
      - name: Build assertions (manifest, output scan, size budget)
        run: pnpm exec vitest run --project build
        env:
          SITEMARK_TARGETS: chrome,firefox,edge,safari
      - name: Check the manifest in every zip (REQ-SEC-008)
        run: node scripts/check-release-zips.ts .output/*.zip
      - name: Checksums
        working-directory: .output
        run: sha256sum -- *.zip > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            .output/*.zip
            .output/SHA256SUMS
          # upload-artifact skips dot-directories like .output unless told otherwise.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  # Provenance for the zips the zip job built: no checkout, no install, no build, so no dependency
  # ever runs next to the OIDC token.
  attest:
    name: attest (build provenance)
    needs: [zip]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write # the OIDC token that signs the provenance
      attestations: write # stores the attestation in the repository
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.zip

  # The GitHub Release carries the checked zips and checksums. It has no secrets and runs no project code.
  release:
    name: release (GitHub Release)
    needs: [attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # creates the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
        # A release made by hand for the tag only gets the zips attached.
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.zip release/SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes ||
            gh release upload "$GITHUB_REF_NAME" release/*.zip release/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber

  submit:
    name: submit (${{ matrix.store }})
    needs: [zip, attest]
    runs-on: ${{ matrix.os }}
    # One job per store: a store that fails doesn't stop the others and is re-run alone. Safari goes
    # through the Mac App Store, so it needs macOS and Xcode; it builds nothing from the workspace.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { store: chrome, os: ubuntu-24.04 }
          - { store: firefox, os: ubuntu-24.04 }
          - { store: edge, os: ubuntu-24.04 }
          - { store: safari, os: macos-15 }
    timeout-minutes: 45
    environment: store
    permissions:
      contents: read
      attestations: read # gh attestation verify
    env:
      BUNDLE_ID: com.nielsvanbrakel.sitemark
      EXTENSION_ID: com.nielsvanbrakel.sitemark.extension
    steps:
      # Only for .nvmrc: nothing from the workspace is installed next to the store secrets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ matrix.store != 'safari' }}
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ matrix.store != 'safari' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ matrix.store != 'safari' }}
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Verify the checksums and the build provenance of every zip
        if: ${{ matrix.store != 'safari' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd release && sha256sum --check SHA256SUMS)
          for zip in release/*.zip; do
            gh attestation verify "$zip" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
      # publish-browser-extension is what `wxt submit` runs. tools/uploader has its own lockfile, so only
      # it and its dependencies are installed here, without install scripts and without the store secrets.
      - name: Install the store uploader from its lockfile
        if: ${{ matrix.store != 'safari' }}
        working-directory: tools/uploader
        run: pnpm install --frozen-lockfile --ignore-workspace --ignore-scripts
      # Each store's step holds only its own secrets and runs in its own matrix job.
      # Set the repository variable CHROME_SUBMIT, FIREFOX_SUBMIT, EDGE_SUBMIT or SAFARI_SUBMIT to
      # "false" to skip that store for a release; unset means on (docs/release.md).
      - name: Submit the Chrome zip for review
        if: ${{ matrix.store == 'chrome' && vars.CHROME_SUBMIT != 'false' }}
        working-directory: tools/uploader
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_API_VERSION: v2 # API v1.1 was shut down on 2026-10-15
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: pnpm exec publish-extension --chrome-zip ../../release/*-chrome.zip
      - name: Submit the Firefox zip for review
        if: ${{ matrix.store == 'firefox' && vars.FIREFOX_SUBMIT != 'false' }}
        working-directory: tools/uploader
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          pnpm exec publish-extension \
            --firefox-zip ../../release/*-firefox.zip \
            --firefox-sources-zip ../../release/*-sources.zip
      - name: Submit the Edge zip for review
        if: ${{ matrix.store == 'edge' && vars.EDGE_SUBMIT != 'false' }}
        working-directory: tools/uploader
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: pnpm exec publish-extension --edge-zip ../../release/*-edge.zip
      - name: Verify the checksums and the build provenance of the Safari zip
        if: ${{ matrix.store == 'safari' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd release && shasum -a 256 --check SHA256SUMS)
          gh attestation verify release/*-safari.zip --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
      # The converter ignores the case of --bundle-identifier (it builds com.nielsvanbrakel.SiteMark and
      # .SiteMark.Extension), but the App Store record is lowercase, so the IDs are forced afterwards.
      - name: Wrap the Safari build in a macOS app project
        if: ${{ matrix.store == 'safari' && vars.SAFARI_SUBMIT != 'false' }}
        run: |
          unzip -q release/*-safari.zip -d safari
          xcrun safari-web-extension-converter safari --project-location xcode --app-name SiteMark \
            --bundle-identifier "$BUNDLE_ID" --macos-only --swift --copy-resources --no-open --no-prompt
          grep -rlI -i "$BUNDLE_ID" xcode | xargs perl -pi -e \
            "s/\Q\$ENV{BUNDLE_ID}\E\.extension/\$ENV{EXTENSION_ID}/gi; s/\Q\$ENV{BUNDLE_ID}\E(?!\.extension)/\$ENV{BUNDLE_ID}/gi"
          grep -rhI "PRODUCT_BUNDLE_IDENTIFIER" xcode | sort -u
          echo "VERSION=$(jq -r .version safari/manifest.json)" >> "$GITHUB_ENV"
      - name: Archive, sign and upload to App Store Connect
        if: ${{ matrix.store == 'safari' && vars.SAFARI_SUBMIT != 'false' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key"
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # The build number must grow with every upload; the run number does.
          xcodebuild archive -project xcode/SiteMark/SiteMark.xcodeproj -scheme SiteMark \
            -destination 'generic/platform=macOS' -archivePath "$RUNNER_TEMP/SiteMark.xcarchive" \
            "${auth[@]}" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            INFOPLIST_KEY_LSApplicationCategoryType=public.app-category.developer-tools \
            INFOPLIST_KEY_ITSAppUsesNonExemptEncryption=NO
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/SiteMark.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" "${auth[@]}"
          rm -f "$key"
