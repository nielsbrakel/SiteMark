name: CI

on:
  pull_request:
  push:
    branches: [main]

# Every job declares its own minimal permissions (REQ-SEC-009, D-238).
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (types, lint, format, unit/dom/browser + coverage, traceability)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    # Keep the tag in sync with @playwright/test (tests/unit/ci-policy.test.ts checks it).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # progress derives task status from the full git history (D-210).
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # The container runs as another user than the checkout; progress reads git history.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: pnpm check:ci
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-unit
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: build (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, safari]
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm wxt zip -b "$BROWSER"
      - name: Build assertions (manifest, output scan, size budget)
        run: pnpm exec vitest run --project build
        env:
          SITEMARK_TARGETS: ${{ matrix.browser }}
      - if: matrix.browser == 'firefox'
        run: pnpm exec web-ext lint --source-dir .output/firefox-mv3 --self-hosted
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-build-${{ matrix.browser }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sitemark-${{ matrix.browser }}
          path: .output/*.zip
          # upload-artifact skips dot-directories like .output unless told otherwise.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: e2e (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-e2e
          path: test-results/playwright.json
          retention-days: 14
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  website:
    name: website (build assertions, e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The container runs as another user than the checkout; let git operate on it.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Unit and component tests of the website run in `check`; this job builds it (as pages.yml
      # deploys it) and tests the built output and the pages in Chromium.
      - run: pnpm web:test:build
      - run: pnpm exec playwright test --config website/playwright.config.ts
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-website
          path: |
            test-results/vitest-website-build.json
            test-results/playwright-website.json
          retention-days: 14
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-website
          path: |
            playwright-report/website/
            test-results/website-e2e/
          retention-days: 14

  workflow-lint:
    name: workflow lint (actionlint, zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          allow-licenses: >-
            MIT, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, CC0-1.0, CC-BY-4.0,
            BlueOak-1.0.0, MPL-2.0, Python-2.0, Zlib, Unlicense

  commitlint:
    name: commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Lint every commit in the pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pnpm exec commitlint --from "$BASE" --to "$HEAD" --verbose
          # commitlint ignores fixup!/squash! commits, but rebase-merge would put them on main.
          if git log --format=%s "$BASE..$HEAD" | grep -E '^(fixup|squash|amend)! '; then
            echo "::error::Squash the fixup commits first: git rebase -i --autosquash $BASE"
            exit 1
          fi

  policy-date:
    name: policy date (a changed PRIVACY*.md has a new Last updated date)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Plain Node is enough: the script has no dependencies (REQ-POLICY-004).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Check the Last updated line of every changed policy file
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-policy-date.ts "$BASE" "$HEAD"

  verify-tdd:
    name: verify-tdd (red before green, red fails, green passes)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # The container runs as another user than the checkout; let git operate on it.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Replay every red → green round of the pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm verify-tdd "$BASE" "$HEAD"

  traceability:
    name: traceability (every finished requirement has a passing test)
    needs: [check, build, e2e, website]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: results-*
          path: test-results/
          merge-multiple: true
      - run: pnpm progress --strict --coverage --verbose

  # The only required status check (docs/repo-setup.md). Add every new job to `needs`.
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      [
        check,
        build,
        e2e,
        traceability,
        verify-tdd,
        workflow-lint,
        dependency-review,
        commitlint,
        policy-date,
        website,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail unless every job succeeded or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All CI jobs passed."
