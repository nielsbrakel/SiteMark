name: Security

# SAST (CodeQL), secrets (gitleaks) and DAST (OWASP ZAP baseline against the built website and extension
# pages). The OpenSSF Scorecard has its own workflow (scorecard.yml). Plan and rationale: docs/security-scanning.md. `security-ok`
# aggregates every job and is a required status check next to `ci-ok` (docs/repo-setup.md).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 04:41 UTC, off the top of the hour.
    - cron: '41 4 * * 1'
  workflow_dispatch:

# Every job declares its own minimal permissions (REQ-SEC-009, D-238).
permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  zap:
    name: ZAP baseline (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: website
            build: pnpm web:build
            dir: website/dist/client
            path: ''
          # The popup and options pages as static files: ZAP sees their markup, scripts and
          # headers, not the browser APIs they need. The runtime attack probes are in
          # tests/e2e/attack-surface.spec.ts.
          - target: extension
            build: pnpm build
            dir: .output/chrome-mv3
            path: options.html
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: $BUILD
        env:
          BUILD: ${{ matrix.build }}
      - name: Serve the build
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 --directory "$DIR" &
          for _ in $(seq 20); do curl -fsS "http://127.0.0.1:8080/$TARGET_PATH" >/dev/null && exit 0; sleep 1; done
          exit 1
        env:
          DIR: ${{ matrix.dir }}
          TARGET_PATH: ${{ matrix.path }}
      # Exit code 1 = a FAIL-level alert (fails the job), 2 = warnings only (reported in the
      # artifact, accepted), 3 = ZAP itself failed. Tune levels in .zap/rules.tsv.
      - name: ZAP baseline scan
        run: |
          mkdir -p zap-report && cp .zap/rules.tsv zap-report/ && chmod -R 777 zap-report
          docker run --rm --network host -v "$PWD/zap-report:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6 \
            zap-baseline.py -t "http://127.0.0.1:8080/$TARGET_PATH" -c rules.tsv -r report.html -J report.json || code=$?
          [ "${code:-0}" -le 2 ] || exit "$code"
        env:
          TARGET_PATH: ${{ matrix.path }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-${{ matrix.target }}
          path: zap-report/
          retention-days: 30
          if-no-files-found: ignore

  gitleaks:
    name: gitleaks (secrets in history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The CLI image (v8.30.1), not gitleaks-action: no license key, no token, no network calls
      # beyond pulling the image. Scans every commit; --redact keeps hits out of the log.
      - name: Scan the full git history
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --verbose

  # A required status check (docs/repo-setup.md). Add every new job to `needs`.
  security-ok:
    name: security-ok
    if: always()
    needs: [codeql, zap, gitleaks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail unless every job succeeded or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All security jobs passed."
