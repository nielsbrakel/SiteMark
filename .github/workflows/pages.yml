name: Pages

# Deploys the website (docs/website/plan.md §8, D-252) on a push to main that changes the website or
# one of its inputs, and on manual dispatch. Pull requests only build and test it (ci.yml).
on:
  push:
    branches: [main]
    paths:
      - website/**
      - src/core/**
      - src/shared/**
      - src/ui/**
      - src/lib/i18n/**
      - src/styles/**
      - public/_locales/**
      - public/icon/**
      - design/logo/**
      - design/social-preview.png
      - PRIVACY*.md
      - CHANGELOG.md
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/pages.yml
  workflow_dispatch:

# Every job declares its own minimal permissions (REQ-SEC-009, D-238).
permissions: {}

# One deploy at a time, and a deploy in progress is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build and check the website
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Like .github/actions/setup, but without a dependency cache: this job publishes.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      # Builds website/dist/client and runs the built-output assertions (CSP, links, budgets).
      - run: pnpm web:test:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist/client

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # The environment only allows main (docs/repo-setup.md).
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
