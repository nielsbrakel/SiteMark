name: Nightly

on:
  schedule:
    # 03:17 UTC every day, off the top of the hour.
    - cron: '17 3 * * *'
  workflow_dispatch:

# Every job declares its own minimal permissions (REQ-SEC-009, D-238).
permissions: {}

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    name: mutation (Stryker, src/core)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Fails below a 60 % mutation score (stryker.config.mjs, REQ-NFR-004).
      - run: pnpm mutation
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14
          if-no-files-found: ignore

  audit:
    name: audit (all dependencies)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Development tools included. Advisories without a fixed version cannot be acted on, so they are skipped.
      - run: pnpm audit --audit-level=high --ignore-unfixable

  perf:
    name: perf probes (REQ-NFR-003, reported only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Runs only the @perf probes (playwright.config.ts). Timings depend on the runner, so a miss is
      # reported as a warning instead of failing the job.
      - id: probes
        run: pnpm test:e2e
        continue-on-error: true
        env:
          PERF: '1'
      - if: steps.probes.outcome == 'failure'
        run: echo "::warning title=Perf probes::a probe missed its budget, see the perf-report artifact"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-report
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  credentials:
    name: store credentials (expiry warning)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # When the Edge API key runs out: update it together with the secret (docs/release.md).
      EDGE_KEY_EXPIRES: '2026-12-30'
    steps:
      # Edge keys expire and then the next release silently skips Edge. Thirty days ahead, open one issue.
      - name: open an issue when the Edge API key expires within 30 days
        run: |
          days=$(( ( $(date -u -d "$EDGE_KEY_EXPIRES" +%s) - $(date -u +%s) ) / 86400 ))
          echo "The Edge API key expires in $days days."
          if [ "$days" -gt 30 ]; then exit 0; fi
          title="Renew the Edge API key before $EDGE_KEY_EXPIRES"
          open=$(gh issue list --state open --search "$title in:title" --json number --jq length)
          if [ "$open" -eq 0 ]; then
            gh issue create --title "$title" --body "The \`EDGE_API_KEY\` in the \`store\` environment expires on $EDGE_KEY_EXPIRES. Renew it (steps: docs/release.md, Renewing store credentials), then move EDGE_KEY_EXPIRES in .github/workflows/nightly.yml to the new date and close this issue."
          fi
