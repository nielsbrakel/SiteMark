<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="t">
  <title id="t">SiteMark: never confuse production with test</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f3f7"/>
      <stop offset="1" stop-color="#dde1e8"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a6b"/>
      <stop offset="1" stop-color="#e5483b"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="-3" dy="-3" stdDeviation="4" flood-color="#ffffff" flood-opacity=".85"/>
      <feDropShadow dx="5" dy="5" stdDeviation="6" flood-color="#a3acbb" flood-opacity=".75"/>
    </filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-8" dy="-8" stdDeviation="10" flood-color="#ffffff" flood-opacity=".9"/>
      <feDropShadow dx="12" dy="12" stdDeviation="16" flood-color="#a3acbb" flood-opacity=".8"/>
    </filter>
    <clipPath id="page">
      <rect x="800" y="90" width="520" height="380" rx="24"/>
    </clipPath>
  </defs>

  <!-- Store marquee promo tile (Chrome Web Store, Edge Add-ons; 1400 × 560): pnpm icons renders it to PNG. -->
  <rect width="1400" height="560" fill="#e6e9ef"/>

  <g font-family="ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#2b2f38">
    <!-- Logo and name -->
    <g transform="translate(90 90) scale(1.1)">
      <rect x="10" y="10" width="108" height="108" rx="28" fill="url(#tile)" filter="url(#soft)"/>
      <path d="M42 24h40a6 6 0 0 1 6 6v74l-26-17-26 17V30a6 6 0 0 1 6-6z" fill="url(#ribbon)"/>
      <path d="M70 56v34l8.5-8 6 13.5 7-3-6-13.2H97z"
            fill="#ffffff" stroke="#2b2f38" stroke-width="3.5" stroke-linejoin="round"/>
    </g>
    <text x="250" y="180" font-size="80" font-weight="700" letter-spacing="-2">
      <tspan>Site</tspan><tspan fill="#e5483b">Mark</tspan>
    </text>

    <!-- Tagline -->
    <text x="90" y="320" font-size="54" font-weight="700">Never confuse</text>
    <text x="90" y="384" font-size="54" font-weight="700">production with test.</text>
    <text x="90" y="450" font-size="28" font-weight="500" fill="#57606a">Private by design. Nothing leaves your browser.</text>
  </g>

  <!-- A marked page, as SiteMark draws it -->
  <rect x="800" y="90" width="520" height="380" rx="24" fill="#f7f8fa" filter="url(#card)"/>
  <g clip-path="url(#page)">
    <rect x="800" y="90" width="520" height="52" fill="#dde1e8"/>
    <circle cx="832" cy="116" r="7" fill="#ff7a6b"/>
    <circle cx="856" cy="116" r="7" fill="#f2c14e"/>
    <circle cx="880" cy="116" r="7" fill="#6cc08b"/>
    <rect x="920" y="102" width="260" height="28" rx="14" fill="#f7f8fa"/>
    <rect x="840" y="176" width="200" height="22" rx="11" fill="#c9ced8"/>
    <rect x="840" y="222" width="420" height="14" rx="7" fill="#dde1e8"/>
    <rect x="840" y="250" width="380" height="14" rx="7" fill="#dde1e8"/>
    <rect x="840" y="278" width="400" height="14" rx="7" fill="#dde1e8"/>
    <rect x="840" y="330" width="150" height="44" rx="12" fill="#e5483b" stroke="#c93a2e" stroke-width="3" stroke-dasharray="8 5"/>
    <rect x="800" y="420" width="520" height="50" fill="#c93a2e"/>
    <text x="1060" y="453" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="20" font-weight="700" letter-spacing="3" fill="#ffffff">PRODUCTION · BE CAREFUL</text>
    <g transform="translate(1320 90) rotate(45)">
      <rect x="-110" y="40" width="220" height="36" fill="#c93a2e"/>
      <text x="0" y="66" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
            font-size="19" font-weight="800" letter-spacing="3" fill="#ffffff">PROD</text>
    </g>
  </g>
</svg>
