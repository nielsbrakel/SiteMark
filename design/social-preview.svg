<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="t">
  <title id="t">SiteMark: never confuse production with test again</title>
  <!-- Fonts: Caveat Brush and Patrick Hand (bundled, OFL). pnpm icons injects them before rendering. -->
  <defs><pattern id="s" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="5" height="10" fill="#fff" fill-opacity=".4"/></pattern></defs>
  <rect width="1280" height="640" fill="#c9a77c"/>
  <g transform="translate(80 70) scale(1.3)">
    <g transform="rotate(-5 64 64)"><path d="M16 14l46-2 50 3-2 48 3 52-50 2-48-3 2-50z" fill="#fbf6e8" stroke="#33261b" stroke-width="3" stroke-linejoin="round"/></g>
    <path d="M42 24h40a6 6 0 0 1 6 6v74l-26-17-26 17V30a6 6 0 0 1 6-6z" fill="#e8664d" stroke="#33261b" stroke-width="3.5" stroke-linejoin="round"/>
