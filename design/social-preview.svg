  <g font-family="'Caveat Brush', 'Patrick Hand', ui-rounded, system-ui, sans-serif" font-size="58" fill="#33261b"><text x="106" y="350">Never confuse</text><text x="106" y="414">production with test.</text></g>
  <g font-family="'Patrick Hand', ui-rounded, system-ui, sans-serif" fill="#33261b"><text x="106" y="476" font-size="30">Ribbons, banners and outlines</text><text x="106" y="514" font-size="30">on the sites you choose.</text><text x="106" y="566" font-size="26" fill="#a63d28">Private · Chrome · Edge · Firefox · Safari</text></g>
