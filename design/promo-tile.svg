<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" role="img" aria-labelledby="t">
  <title id="t">SiteMark: never mistake production for test</title>
  <!-- Fonts: Caveat Brush and Patrick Hand (bundled, OFL). pnpm icons injects them before rendering and
       draws the marker highlight behind each tspan.hl (scripts/render-icons.mjs). Thumbnail: the name, the line and a loud red PROD ribbon.
       Generated in the store slides' language (D-299): kraft board, browser windows with the marks
       SiteMark draws in the mark presets (D-205), centred tape, no dashed lines. -->
  <defs><pattern id="stripes" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="10" fill="#fff" fill-opacity=".4"/></pattern>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#3c230f" flood-opacity=".28"/></filter>
    <clipPath id="logo-clip"><rect x="16" y="20" width="96" height="88" rx="12"/></clipPath></defs>
  <rect width="440" height="280" fill="#c9a77c"/>
  
  <g transform="translate(12 10) scale(0.56)">
    <rect x="16" y="20" width="96" height="88" rx="12" fill="#fffaf0" stroke="#fffaf0" stroke-width="8" stroke-linejoin="round"/>
    <rect x="16" y="20" width="96" height="88" rx="12" fill="#fbf6e8"/>
    <path d="M16 46H112" stroke="#33261b" stroke-width="3"/><circle cx="30" cy="33" r="2" fill="#33261b"/>
    <g clip-path="url(#logo-clip)"><path d="M44 10L84 10L124 50L124 90Z" fill="#e8664d" stroke="#33261b" stroke-width="3" stroke-linejoin="round"/></g>
    <rect x="16" y="20" width="96" height="88" rx="12" fill="none" stroke="#33261b" stroke-width="3.5" stroke-linejoin="round"/>
  </g>
  <text x="88" y="66" font-family="'Caveat Brush', 'Patrick Hand', ui-rounded, system-ui, sans-serif" font-size="42" fill="#33261b">SiteMark</text>
  <text font-family="'Caveat Brush', 'Patrick Hand', ui-rounded, system-ui, sans-serif" font-size="31" fill="#33261b"><tspan x="26" y="148">Never mistake</tspan><tspan x="26" y="186"><tspan class="hl">production</tspan></tspan><tspan x="26" y="224">for test</tspan></text>
  <g>
    <rect x="252" y="89" width="168" height="164" rx="8" fill="#d9ccb0" filter="url(#lift)"/>
    <rect x="252" y="86" width="168" height="164" rx="8" fill="#fbf6e8"/>
    <path d="M252 94a8 8 0 0 1 8-8h152a8 8 0 0 1 8 8v22H252Z" fill="#efe4cb"/>
    <rect x="260" y="94" width="152" height="14" rx="7" fill="#fffdf4"/>
    <clipPath id="v"><rect x="253.5" y="116" width="165" height="132.5"/></clipPath>
    <g clip-path="url(#v)">
      <rect x="253.5" y="116" width="165" height="132.5" fill="#fbf6e8"/>
      <rect x="267.5" y="130" width="69.3" height="9" rx="4.5" fill="#efe4cb"/>
      <rect x="267.5" y="150" width="115.49999999999999" height="7" rx="3.5" fill="#efe4cb"/><rect x="267.5" y="164" width="99" height="7" rx="3.5" fill="#efe4cb"/>
      
      <rect x="255.5" y="118" width="161" height="128.5" fill="none" stroke="#c93a2e" stroke-width="4"/>
      <g transform="translate(418.5 116) rotate(45)"><rect x="-112" y="22.400000000000002" width="224" height="28" fill="#c93a2e"/><text x="0" y="42.699999999999996" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="14" letter-spacing=".5" fill="#fff">PROD</text></g>
    </g>
    <path d="M252 116H420" stroke="#33261b" stroke-width="2"/>
    <rect x="252" y="86" width="168" height="164" rx="8" fill="none" stroke="#33261b" stroke-width="3"/>
  </g>
  <g transform="rotate(-3 336 84)" opacity=".92"><rect x="304" y="74" width="64" height="20" fill="#f5cf5a"/><rect x="304" y="74" width="64" height="20" fill="url(#stripes)"/></g>
</svg>
